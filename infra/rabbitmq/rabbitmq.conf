## RabbitMQ Configuration for E-commerce Comparison

# Management plugin
# Disabled: definitions.json was overriding default user
# management.load_definitions = /etc/rabbitmq/definitions.json

# Default user/vhost
default_user = guest
default_pass = guest
default_vhost = /

# Allow guest user to connect from remote hosts (containers)
loopback_users = none

# Logging
log.console = true
log.console.level = info

# Message settings
consumer_timeout = 1800000

# Queue settings
queue_master_locator = min-masters
